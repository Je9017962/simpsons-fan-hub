      <article class="exhibit__article">
        <h2 class="exhibit__heading">
          The Art of The Simpsons: A Springfield Celebration at the Hilbert Museum</h2>

        <p>Calling all Simpsons fans! For the first time ever, Homer, Marge, Bart, Lisa, and other beloved residents of Springfield are taking center stage in an exhibition dedicated to the art behind the iconic animated series.</p>

        <p class="exhibit__image-text">
          <img class="text-image2"
          src="Simpsons2.jpg" 
          alt="The Simpsons Image 2">
          
          <strong>"The Art of The Simpsons"</strong> is now on view at the <strong>Hilbert Museum of California Art</strong> at Champman University in Orange, California. Opened on <strong>November 18, 2026</strong>, as part of the museum's 10th anniversary celebration, the exhibition features original illustrations and production cels showcasing some of the most recognizable characters from the world of <em>The Simpsons</em>. Originally created by Matt Groening and brought to life by talented animators at Fox Television Animation, these artworks offer fans a special opportunity to explore the creative process behind one of television's most beloved animated series.</p>

        <p>The exhibition draws from the Hilbert Collection's extensive holdings of animation and movie art, which also include works associated with <a href="https://www.disney.com" target="_blank">Disney</a>, <a href="https://www.pixar.com" target="_blank">Pixar</a>, <a href="https://www.Lucasfilm.com" target="_blank">Lucasfilm</a>, <a href="https://www.marvel.com" target="_blank">Marvel</a>, <a href="https://www.warnerbros.com/brands/hanna-barbera" target="_blank">Hanna-Barbera</a>, and <a href="https://www.sesamestreet.org" target="_blank">Sesame Street</a>.
        </p>

        <p>
          Whether you've followed the advantures of the Simpson family for decades or simply love animation, this is a chance to experience Springfield from a whole new perspective!
        </p>

        <h3 class="exhibit__subheading">Exhibition Details</h3>

        <ul class="exhibit__details">
          <li><strong>Location:</strong> Hilbert Museum of California Art, Champman University, Orange, California</li>
          <li><strong>Gallery:</strong> North Gallery</li>
          <li><strong>Opening Date:</strong> November 18, 2026</li>
          <li><strong>Admission:</strong> Free</li>
          <li><strong>Museum Hours:</strong> Wednesday-Sunday; closed Monday and Tuesday</li>
        </ul>

        <p>
          Advanced online reservations are recommended due to expected demand.
        </p>

        <p>
          For more information, please visit the <a href="https://www.hilbertmuseum.org" target="_blank">Hilbert Museum website</a>.
        </p>
